<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🌿 菜園ダッシュボード</title>
<style>
  :root{
    --paper:#F7F9F4;
    --ink:#1B2A20;
    --ink-soft:#5C6B5F;
    --line:#DCE3D6;
    --leaf:#3F6B45;
    --soil:#8A6B4F;
    --water:#2E6F94;
    --warn:#B07A12;
    --warn-deep:#8A5E0A;
    --alert:#A63D2C;
    --sky:#E8F1F6;
    --accent:#3F6B45;
    --accent-soft:#3F6B4526;
    --card:#FFFFFF;
    --title:#1B2A20;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;padding:0 20px 80px;
    background:var(--paper);color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
    font-size:15px;line-height:1.75;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:880px;margin:0 auto;}
  a{color:inherit;}

  /* ---------- ヘッダー ---------- */
  header{
    position:relative;overflow:hidden;
    padding:40px 22px 24px;margin:0 -22px;
    border-top:4px solid var(--accent);
    border-bottom:2px solid var(--ink);
    background:linear-gradient(170deg, var(--accent-soft) 0%, transparent 72%);
    display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;
  }
  .motif{
    position:absolute;right:6px;top:-10px;width:196px;height:196px;
    color:var(--accent);opacity:.34;pointer-events:none;
  }
  .motif.s2{right:186px;top:58px;width:96px;height:96px;opacity:.2;}
  .motif.s3{right:auto;left:-26px;top:64px;width:120px;height:120px;opacity:.13;}
  h1{
    font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    font-size:32px;font-weight:600;letter-spacing:.14em;margin:0 0 6px;line-height:1.3;
    position:relative;color:var(--title);
  }
  .sub{font-size:12px;color:var(--ink-soft);letter-spacing:.08em;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:relative;}
  .place{font-size:11.5px;color:var(--ink-soft);letter-spacing:.1em;text-align:right;line-height:1.9;position:relative;}
  .reload{
    border:1px solid var(--line);background:transparent;color:var(--ink-soft);
    font-family:inherit;font-size:11px;letter-spacing:.08em;
    padding:4px 12px;border-radius:2px;cursor:pointer;transition:background .15s,color .15s;
  }
  .reload:hover{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .reload:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

  /* ---------- セクション ---------- */
  section{margin-top:44px;}
  h2{
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:17px;font-weight:600;letter-spacing:.18em;color:var(--title);
    margin:0 0 16px;padding-bottom:10px;
    border-bottom:1px solid var(--line);box-shadow:0 1px 0 0 var(--accent-soft);
    display:flex;justify-content:space-between;align-items:baseline;gap:12px;
  }
  h2 .t{display:flex;align-items:center;gap:10px;}
  h2 em{font-style:normal;font-family:"Hiragino Sans",sans-serif;font-size:11px;letter-spacing:.1em;color:var(--ink-soft);text-align:right;}
  /* 見出しや札に添える線画。ヘッダーの絵柄と同じ描き方で季節色に連動する */
  .ic{flex:0 0 auto;color:var(--accent);}
  h2 .ic{width:19px;height:19px;}

  /* 折りたたみ */
  details{border:1px solid var(--line);background:var(--card);margin-top:10px;}
  summary{
    cursor:pointer;padding:13px 18px;font-size:12.5px;letter-spacing:.08em;color:var(--ink-soft);
    list-style:none;display:flex;justify-content:space-between;align-items:center;
  }
  summary::-webkit-details-marker{display:none;}
  summary::after{content:"＋";font-size:13px;color:var(--ink-soft);}
  details[open] summary::after{content:"−";}
  details[open] summary{border-bottom:1px solid var(--line);color:var(--ink);}
  summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px;}
  .body{padding:16px 18px 18px;}

  /* ---------- 要約の一行 ---------- */
  /* 箱で囲わず文章に近い並びにして、主役である株のカードへ視線を流す */
  .tally{
    display:flex;flex-wrap:wrap;align-items:baseline;
    margin:-4px 0 16px;font-size:12.5px;color:var(--ink-soft);letter-spacing:.04em;
  }
  .tally span{padding:0 14px;border-left:1px solid var(--line);line-height:1.6;}
  .tally span:first-child{padding-left:0;border-left:none;}
  .tally b{font-size:15px;font-weight:700;color:var(--ink);margin:0 2px;letter-spacing:0;}
  /* 要対応はふだん山吹。異常の株があるときだけ煉瓦色に上げる */
  .tally .hot,.tally .hot b,.tally .hot .jump,.tally .hot .jump b{color:var(--warn-deep);}
  .tally .hot .jump{border-bottom-color:var(--warn-deep);}
  .tally .hot.bad,.tally .hot.bad b,.tally .hot.bad .jump,.tally .hot.bad .jump b{color:var(--alert);}
  .tally .hot.bad .jump{border-bottom-color:var(--alert);}
  .tally .jump{
    font-family:inherit;font-size:inherit;letter-spacing:inherit;line-height:inherit;
    background:transparent;border:none;padding:0;cursor:pointer;
    border-bottom:1px dashed currentColor;
  }
  .tally .jump:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  /* 裏で新しい記録に切り替わったことを知らせる。
     画面のどこを見ていても目に入るよう、上部に貼り付ける。
     触れば消える。30秒経てば自然に消える */
  #fresh{
    display:none;position:fixed;top:12px;left:50%;transform:translateX(-50%);
    z-index:50;max-width:min(92vw,420px);
    font-size:12.5px;letter-spacing:.06em;font-weight:700;color:#fff;
    background:var(--leaf);border-radius:3px;padding:10px 18px;
    box-shadow:0 3px 14px rgba(27,42,32,.28);cursor:pointer;white-space:nowrap;
  }
  .plants.only .card:not(.attn){display:none;}
  .only-note{
    display:none;font-size:11.5px;letter-spacing:.06em;color:var(--warn-deep);
    border-left:3px solid var(--warn-deep);padding:5px 0 5px 10px;margin-bottom:12px;
  }
  .only-note.bad{color:var(--alert);border-left-color:var(--alert);}
  /* 折り返すと行頭に区切り線が残ってしまうため、狭い幅では線をやめて2列に揃える */
  @media(max-width:620px){
    .tally{display:grid;grid-template-columns:1fr 1fr;gap:3px 12px;margin-bottom:18px;}
    .tally span{padding:0;border-left:none;}
  }

  /* ---------- 重大な報せ ---------- */
  .critical{margin-top:12px;border:1px solid var(--alert);background:#FBEFED;padding:15px 18px;}
  .critical h3{margin:0 0 6px;font-size:11.5px;letter-spacing:.14em;color:var(--alert);font-weight:700;}
  .critical p{margin:0 0 4px;font-size:13.5px;line-height:1.7;}
  .critical p:last-child{margin-bottom:0;}
  /* 文と「確認した」を左右に置く。文が何行になってもボタンは行の頭に留まる */
  .critical .line{display:flex;align-items:flex-start;gap:14px;margin:0 0 7px;}
  .critical .line:last-child{margin-bottom:0;}
  .critical .line p{flex:1 1 auto;margin:0;}
  .critical .rsn{font-weight:700;}
  /* 記録の進捗にあたる操作なので、異常の煉瓦色ではなく墨色で示す */
  .critical .seen{
    flex:0 0 auto;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;
    font:inherit;font-size:12px;line-height:1.5;padding:4px 11px;cursor:pointer;
    border:1px solid var(--ink);background:transparent;color:var(--ink);
  }
  .critical .seen .ic{width:12px;height:12px;color:currentColor;}
  .critical .seen:hover{background:var(--ink);color:#FBEFED;}
  .critical .seen[disabled]{opacity:.45;cursor:default;}
  .critical .more{margin:9px 0 0;font-size:12.5px;color:var(--ink-soft);}
  /* 狭い幅では左右に置けないので、ボタンを次の行へ回す */
  @media(max-width:520px){
    .critical .line{flex-wrap:wrap;gap:6px;}
    .critical .line p{flex:1 1 100%;}
  }

  /* ---------- 株カード ---------- */
  .plants{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:1px;background:var(--card);border:1px solid var(--line);margin-top:12px;}
  .card{
    background:var(--card);padding:18px 18px 16px 15px;display:flex;flex-direction:column;
    box-shadow:0 0 0 1px var(--line);border-left:4px solid var(--ink-soft);
  }
  /* 状態は左端の帯でも示す。並べたとき端を追うだけで見分けられる */
  .card.s良好{border-left-color:var(--leaf);}
  .card.s注意{border-left-color:var(--warn);}
  .card.s異常{border-left-color:var(--alert);}
  /* 判別不能は「撮り直せば分かる」状態。異常や注意より軽く、灰緑で置く */
  .card.s判別不能{border-left-color:var(--ink-soft);}
  .card.u0,.card.u1{background:#FEFAF9;}
  .card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .card .nm{font-size:16px;font-weight:700;letter-spacing:.04em;}
  .card .phase{font-size:11px;color:var(--ink-soft);letter-spacing:.06em;margin-top:2px;}
  /* 色だけでなく記号でも区別できるようにする */
  .badge{
    font-size:10.5px;letter-spacing:.08em;padding:3px 9px 3px 7px;border-radius:2px;
    white-space:nowrap;color:#fff;font-weight:700;background:var(--ink-soft);
    display:inline-flex;align-items:center;gap:4px;
  }
  .badge .ic{width:12px;height:12px;color:#fff;}
  .badge.良好{background:var(--leaf);}
  .badge.注意{background:var(--warn-deep);}
  .badge.異常{background:var(--alert);}
  .badge.判別不能{background:var(--ink-soft);}
  /* 右上のならび。対応済みの印は札の左に置く */
  .marks{display:flex;align-items:center;gap:6px;flex-shrink:0;}
  .done-chip{
    display:none;align-items:center;gap:3px;white-space:nowrap;
    font-size:10.5px;font-weight:700;letter-spacing:.08em;
    color:var(--ink);border:1px solid var(--ink);border-radius:2px;padding:2px 6px 2px 4px;
  }
  .card.logged .done-chip{display:inline-flex;}
  /* 今日より前の記録に対する対応は、日付を添えて弱く出す */
  .done-chip.old{color:var(--ink-soft);border-color:var(--line);font-weight:400;}
  .done-chip .ic{width:11px;height:11px;}
  /* 要対応の理由。何をすればよいかをカード上で言い切る */
  .why{
    display:flex;align-items:flex-start;gap:5px;margin-top:9px;
    font-size:11.5px;line-height:1.6;letter-spacing:.04em;font-weight:700;color:var(--warn-deep);
  }
  .why .ic{width:13px;height:13px;flex-shrink:0;margin-top:2px;}
  .why.bad{color:var(--alert);}
  .why.cam{color:var(--ink-soft);}
  .gauge{margin:12px 0 13px;}
  .gauge .row{display:flex;justify-content:space-between;font-size:11px;color:var(--ink-soft);letter-spacing:.06em;margin-bottom:6px;}
  .gauge .row .val{color:var(--ink);font-weight:700;}
  /* 水やりが要る株は、この行そのものを水の色にする */
  .gauge .row.need,.gauge .row.need .val{color:var(--water);font-weight:700;}
  .gauge .row .lb{display:inline-flex;align-items:center;gap:4px;}
  .gauge .row .lb .ic{width:12px;height:12px;}
  .bar{display:flex;gap:2px;height:7px;}
  .bar i{flex:1;background:var(--line);border-radius:1px;}
  .bar i.on{background:var(--water);}
  .bar.thirsty i.on{background:var(--soil);}
  .note{font-size:12.5px;color:var(--ink-soft);line-height:1.7;border-top:1px dotted var(--line);padding-top:11px;margin-top:auto;}
  .note b{color:var(--ink);font-weight:700;}
  /* 見立ては状態の説明、次の一手は行動。後者を前に出す */
  .note .see{font-size:12px;padding-bottom:9px;}
  .note .see b{color:var(--ink-soft);font-weight:700;}
  .note .act b{color:var(--ink);}

  /* ---------- 作業の申告 ---------- */
  .log{border-top:1px dotted var(--line);margin-top:11px;padding-top:10px;}
  .log .open{
    border:1px solid var(--line);background:transparent;color:var(--ink-soft);
    font-family:inherit;font-size:11.5px;letter-spacing:.06em;padding:4px 11px;
    border-radius:2px;cursor:pointer;width:100%;transition:background .15s,color .15s;
  }
  .log .open:hover{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .log .open:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
  /* まだ記録していない株は、押してほしいので塗りにする */
  .log .open.lead{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700;}
  .log .open.lead:hover{background:var(--ink-soft);border-color:var(--ink-soft);}
  .log .done{
    display:flex;align-items:center;gap:4px;
    font-size:11.5px;color:var(--ink);font-weight:700;letter-spacing:.06em;
  }
  .log .done .ic{width:12px;height:12px;flex-shrink:0;}
  .log .todo{font-size:11.5px;color:var(--ink-soft);letter-spacing:.06em;}
  .log .sent{font-size:11px;color:var(--ink-soft);letter-spacing:.04em;}
  .log .picks{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:9px;}
  .log .pick{
    border:1px solid var(--line);background:var(--card);color:var(--ink-soft);
    font-family:inherit;font-size:11.5px;letter-spacing:.04em;padding:3px 9px;
    border-radius:2px;cursor:pointer;transition:all .12s;
  }
  .log .pick[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700;}
  .log .pick:focus-visible{outline:2px solid var(--accent);outline-offset:1px;}
  .log .row{display:flex;gap:6px;}
  .log .send{
    flex:1;border:1px solid var(--ink);background:var(--ink);color:#fff;
    font-family:inherit;font-size:11.5px;font-weight:700;letter-spacing:.06em;
    padding:5px 0;border-radius:2px;cursor:pointer;
  }
  .log .send:disabled{opacity:.4;cursor:default;}
  .log .cancel{
    border:1px solid var(--line);background:transparent;color:var(--ink-soft);
    font-family:inherit;font-size:11.5px;padding:5px 12px;border-radius:2px;cursor:pointer;
  }
  .log .msg{font-size:11.5px;letter-spacing:.04em;margin-top:7px;}
  .log .msg.ng{color:var(--alert);}

  /* ---------- 天気：現在 ---------- */
  .now{
    background:var(--sky);border:1px solid var(--line);padding:20px 22px;
    display:flex;align-items:center;justify-content:space-between;gap:22px;flex-wrap:wrap;
  }
  .now .lead{display:flex;align-items:center;gap:18px;}
  .now .ic{font-size:44px;line-height:1;}
  .now .tp{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:44px;font-weight:600;line-height:1;}
  .now .tp small{font-size:16px;font-weight:400;margin-left:2px;}
  .now .cond{font-size:13px;letter-spacing:.08em;margin-top:5px;color:var(--ink-soft);}
  .now .metrics{display:flex;flex-wrap:wrap;}
  .now .m{padding:0 16px;border-left:1px solid rgba(0,0,0,.09);text-align:center;min-width:74px;}
  .now .m:first-child{border-left:none;}
  .now .m b{display:block;font-size:16px;font-weight:700;white-space:nowrap;}
  .now .m span{display:block;font-size:10.5px;color:var(--ink-soft);letter-spacing:.1em;margin-top:2px;}
  .arw{display:inline-block;line-height:1;transform-origin:50% 50%;}

  /* ---------- 天気：3時間ごと ---------- */
  .hours{display:grid;grid-template-columns:repeat(8,1fr);}
  .hr{padding:10px 2px 9px;text-align:center;}
  .hr.night{background:#FAFBF8;}
  .hr .t{font-size:10.5px;color:var(--ink-soft);}
  .hr .i{font-size:18px;line-height:1.5;}
  .hr .d{font-size:14px;font-weight:700;}
  .hr .p{font-size:10px;color:var(--water);height:15px;white-space:nowrap;}
  .hr .mm{font-size:9.5px;color:var(--ink-soft);height:14px;letter-spacing:-.02em;white-space:nowrap;}
  .hr .w{font-size:11px;color:var(--ink-soft);}

  /* ---------- 天気：週間 ---------- */
  /* 表全体をひとつの格子として組む。列幅は中身に合わせて決まるので、
     風向が「西北西」になっても風速が2桁になってもはみ出さない。
     区切り線は各セルの上辺をつないで一本に見せるため、列の間隔は空けず
     セル内側の余白で間を取る。高さも行いっぱいに伸ばして線の位置を揃える */
  .week{
    display:grid;font-size:13px;align-items:stretch;
    grid-template-columns:max-content max-content max-content minmax(64px,1fr) max-content;
  }
  .wc{
    padding:10px 6px;border-top:1px solid var(--line);min-width:0;
    display:flex;align-items:center;
  }
  .week > .wc:nth-child(-n+5){border-top:none;}
  .wc.dy{padding-left:0;letter-spacing:.04em;white-space:nowrap;}
  .wc.dy s{text-decoration:none;font-size:11px;color:var(--ink-soft);margin-left:3px;}
  .wc.ic{font-size:17px;justify-content:center;}
  /* 降水は確率と雨量を上下に重ねる。どちらも無い日は空欄のまま */
  .wc.pp{flex-direction:column;align-items:flex-end;justify-content:center;line-height:1.35;}
  .wc.pp b{font-size:11px;color:var(--water);font-weight:400;}
  .wc.pp s{text-decoration:none;font-size:10px;color:var(--ink-soft);}
  .wc.wd{
    padding-right:0;justify-content:flex-end;
    font-size:11px;color:var(--ink-soft);white-space:nowrap;
  }
  .rng{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink-soft);}
  .rng .track{flex:1;height:5px;background:var(--line);border-radius:3px;position:relative;min-width:40px;}
  .rng .fill{position:absolute;height:100%;border-radius:3px;background:linear-gradient(90deg,#7FA8C4,#D8A15C);}
  .rng b{color:var(--ink);font-weight:700;font-size:12px;white-space:nowrap;}

  /* 曜日と祝日の色 */
  .sun,.hol{color:var(--alert);}
  .sat{color:var(--water);}

  /* ---------- カレンダー ---------- */
  .cal .hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .cal .mn{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:15px;letter-spacing:.12em;}
  .cal .nav{display:flex;gap:6px;}
  .cal .nav button{
    border:1px solid var(--line);background:var(--card);color:var(--ink-soft);font-family:inherit;
    font-size:12px;padding:3px 11px;border-radius:2px;cursor:pointer;transition:background .15s,color .15s;
  }
  .cal .nav button:hover{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .cal .nav button:disabled{opacity:.35;cursor:default;}
  .cal .nav button:disabled:hover{background:var(--card);color:var(--ink-soft);border-color:var(--line);}
  .cal .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;text-align:center;}
  .cal .dow{font-size:10px;color:var(--ink-soft);letter-spacing:.06em;padding:3px 0 5px;border-radius:2px;}
  .cal .dow.sun{background:rgba(166,61,44,.10);}
  .cal .dow.sat{background:rgba(46,111,148,.10);}
  .cal .dd{
    font-size:12.5px;padding:8px 0 5px;position:relative;border-radius:2px;
    border:1px solid transparent;background:none;font-family:inherit;color:inherit;width:100%;
  }
  /* 休みの日は網掛けにして、平日との差を大きくする */
  .cal .dd.hol{background:rgba(166,61,44,.09);}
  .cal .dd.sat{background:rgba(46,111,148,.09);}
  .cal .dd.empty{visibility:hidden;}
  /* 記録のある日は下に太い帯を敷いて、離れた位置からでも見えるようにする */
  .cal .dd.hit{cursor:pointer;font-weight:700;}
  .cal .dd.hit::after{
    content:"";display:block;height:5px;margin:5px auto 0;width:62%;border-radius:3px;background:var(--leaf);
  }
  .cal .dd.hit.warn::after{background:var(--warn);}
  .cal .dd.hit.bad::after{background:var(--alert);}
  .cal .dd:not(.hit)::after{content:"";display:block;height:5px;margin-top:5px;}
  .cal .dd.hit:hover{border-color:var(--ink-soft);}
  .cal .dd.on{border-color:var(--ink);background:var(--accent-soft);}
  .cal .dd.today{background:var(--ink);color:var(--paper);font-weight:700;}
  .cal .dd.today.on{background:var(--ink);}
  .lg{font-size:10.5px;color:var(--ink-soft);letter-spacing:.06em;margin-top:14px;display:flex;gap:14px;flex-wrap:wrap;align-items:center;}
  .lg span{display:flex;align-items:center;gap:5px;}
  .lg i{width:14px;height:5px;border-radius:3px;display:inline-block;background:var(--leaf);}
  .lg i.warn{background:var(--warn);}
  .lg i.bad{background:var(--alert);}
  .daybox{margin-top:14px;border-top:1px solid var(--line);padding-top:12px;font-size:13px;}
  .daybox h5{margin:0 0 8px;font-size:12px;letter-spacing:.1em;color:var(--ink-soft);font-weight:400;}
  .daybox .rw{display:flex;gap:10px;align-items:baseline;padding:6px 0;border-bottom:1px dotted var(--line);}
  .daybox .rw:last-child{border-bottom:none;}
  .daybox .rw b{white-space:nowrap;}
  .daybox .rw span{color:var(--ink-soft);font-size:12.5px;}

  /* ---------- 記録テーブル ---------- */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{text-align:left;font-size:10.5px;letter-spacing:.12em;color:var(--ink-soft);font-weight:400;padding:0 10px 8px 0;border-bottom:1px solid var(--line);}
  td{padding:10px 10px 10px 0;border-bottom:1px solid var(--line);vertical-align:top;}
  td.d{color:var(--ink-soft);white-space:nowrap;font-size:12px;}
  td.p{font-weight:700;white-space:nowrap;}
  td.w{color:var(--ink-soft);font-size:12px;}
  /* 一覧の状態表示も記号を添えて揃える */
  .pill{display:inline-flex;align-items:center;gap:3px;font-size:10.5px;padding:1px 7px 1px 5px;border-radius:2px;white-space:nowrap;}
  .pill .ic{width:11px;height:11px;}
  .pill.良好{color:#2E5233;background:#E7EFE6;}
  .pill.注意{color:#7A5208;background:#F7EFDC;}
  .pill.異常{color:#fff;background:var(--alert);}
  .pill.異常 .ic{color:#fff;}
  .pill.unknown{color:var(--ink-soft);background:var(--line);}
  .pill.判別不能{color:var(--ink-soft);background:var(--line);}
  .past .r{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dotted var(--line);font-size:13px;}
  .past .r:last-child{border-bottom:none;}
  .past .r span{color:var(--ink-soft);font-size:12px;white-space:nowrap;}
  .foot{margin-top:12px;font-size:12px;color:var(--ink-soft);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .foot a{color:var(--water);text-decoration:none;border-bottom:1px solid currentColor;}
  .foot a:hover{color:var(--ink);}

  /* ---------- 季節のたより ---------- */
  /* 札ごとに色を変えて賑やかにする。背景には同じ絵柄を大きく透かす */
  .season{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:1px;background:var(--paper);border:1px solid var(--line);}
  .sc{
    position:relative;overflow:hidden;padding:16px 19px 17px;
    box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column;
    border-top:3px solid var(--w);
  }
  /* 背景に同じ絵柄を大きく透かして、札ごとの表情を出す */
  .sc .wm{
    position:absolute;right:-16px;bottom:-20px;width:104px;height:104px;
    color:var(--w);opacity:.14;pointer-events:none;transform:rotate(-8deg);
    stroke-width:1;
  }
  .sc > *{position:relative;}
  .sc .lab{font-size:9.5px;letter-spacing:.24em;color:var(--c);font-weight:700;display:flex;align-items:center;gap:7px;}
  .sc .lab .ic{width:14px;height:14px;color:var(--c);}
  .sc h4{font-family:"Hiragino Mincho ProN","Yu Mincho",serif;font-size:15px;font-weight:600;letter-spacing:.1em;margin:5px 0 8px;color:var(--c);}
  .sc p{margin:0;font-size:12.5px;line-height:1.85;color:var(--b);}
  .sc p b{color:var(--c);font-weight:700;}
  .sc .kw{display:inline-block;font-size:10.5px;letter-spacing:.08em;color:var(--c);border:1px solid currentColor;border-radius:2px;padding:0 7px;margin-bottom:7px;align-self:flex-start;}
  .sc .go{
    margin-top:auto;padding-top:11px;font-size:11.5px;letter-spacing:.06em;
    color:var(--c);text-decoration:none;display:inline-block;font-weight:700;
  }
  .sc .go::after{content:" ↗";font-size:10px;}
  .sc .go:hover{opacity:.7;}

  .credit{margin-top:52px;padding-top:20px;border-top:1px solid var(--line);font-size:11px;color:var(--ink-soft);letter-spacing:.08em;text-align:center;line-height:2;}

  .state{padding:40px 0;text-align:center;color:var(--ink-soft);font-size:13px;letter-spacing:.08em;}
  .state.err{text-align:left;border-left:3px solid var(--alert);background:var(--card);padding:18px 20px;color:var(--ink);}
  .state.err b{display:block;margin-bottom:6px;}
  .state.err span{font-size:12.5px;color:var(--ink-soft);}

  .fade{animation:fade .45s ease both;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){.fade{animation:none;}}

  @media(max-width:560px){
    body{padding:0 16px 60px;}
    h1{font-size:25px;}
    header{align-items:flex-start;}
    .place{text-align:left;}
    .motif{width:148px;height:148px;opacity:.3;right:-4px;}
    .motif.s2{display:none;}
    .motif.s3{width:88px;height:88px;left:-30px;opacity:.12;}
    /* 現在の天気は上下に分け、4つの指標を等幅に並べて段落ちを防ぐ */
    .now{flex-direction:column;align-items:stretch;gap:16px;padding:18px 14px;}
    .now .lead{justify-content:center;}
    .now .metrics{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid rgba(0,0,0,.09);padding-top:14px;}
    .now .m{padding:0 2px;min-width:0;}
    .now .m b{font-size:14px;}
    .now .m b small{font-size:10px;}
    .now .m span{font-size:9.5px;letter-spacing:.04em;}
    .hours{grid-template-columns:repeat(4,1fr);}
    .hr:nth-child(n+5){border-top:1px solid var(--line);}
    .week{grid-template-columns:max-content max-content max-content minmax(56px,1fr);}
    .wc{padding:10px 5px;}
    .wc.rng{padding-right:0;}
    .wc.wd{display:none;}
    td.w,th.w{display:none;}
    h2{flex-direction:column;gap:2px;}
    h2 em{text-align:left;}
  }
</style>
</head>
<body>

<script>
/* ===================== 設定 ===================== */
const DB_URL = "https://www.notion.so/17fd5f782f50438fb796d54617be9cfd";
const LAT = 35.8307, LON = 139.8722;

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const DOW = ["日","月","火","水","木","金","土"];
const pad = (n) => String(n).padStart(2, "0");

const W_ICON = {0:"☀️",1:"🌤️",2:"⛅",3:"☁️",45:"🌫️",48:"🌫️",51:"🌦️",53:"🌦️",55:"🌧️",56:"🌧️",57:"🌧️",

  56:"凍雨",57:"凍雨",61:"小雨",63:"雨",65:"大雨",66:"凍雨",67:"凍雨",71:"小雪",73:"雪",75:"大雪",77:"雪",

const COMPASS = ["北","北北東","北東","東北東","東","東南東","南東","南南東","南","南南西","南西","西南西","西","西北西","北西","北北西"];

/* 気象の風向は風が吹いてくる向き。矢印は進む向きに回す */
function wind(deg){
  if (deg == null) return "—";
  return `<span class="arw" style="transform:rotate(${(deg + 180) % 360}deg)">↑</span> ${COMPASS[Math.round(deg / 22.5) % 16]}`;
}

/* ===================== 線画アイコン ===================== */
/* ヘッダーの絵柄と同じ、細い線だけで描く。色は季節色を継ぐ */
const ICONS = {
  sprout:   `<path d="M12 21V11"/><path d="M12 13C8 13 5.5 10.5 5.5 6.5C9.5 6.5 12 9 12 13Z"/><path d="M12.6 12C12.6 8.6 14.8 6 18.5 6C18.5 9.4 16.3 12 12.6 12Z"/>`,
  sky:      `<circle cx="8" cy="8.5" r="3.2"/><path d="M8 3.2v-1M8 14.8v1M3.4 8.5h-1M13.6 8.5h1M4.7 5.2 4 4.5M11.3 11.8l.7.7M11.3 5.2l.7-.7M4.7 11.8 4 12.5"/><path d="M9.5 19.5h8a3 3 0 0 0 0-6 4.4 4.4 0 0 0-8.3-1.2 3.6 3.6 0 0 0 .3 7.2Z"/>`,
  calendar: `<rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 9.5h17M8 3.5v3M16 3.5v3"/><path d="M7.5 13h2M11 13h2M14.5 13h2M7.5 16.8h2M11 16.8h2"/>`,
  list:     `<path d="M4 6.5h2M4 12h2M4 17.5h2"/><path d="M9.5 6.5h10.5M9.5 12h10.5M9.5 17.5h7"/>`,
  archive:  `<rect x="3.5" y="4.5" width="17" height="4.5" rx="1.2"/><path d="M5.5 9v9a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2V9"/><path d="M10 13.5h4"/>`,
  letter:   `<rect x="3" y="5.5" width="18" height="13" rx="2"/><path d="M3.6 6.8 12 13l8.4-6.2"/>`,
  flower:   `<circle cx="12" cy="12" r="2.4"/><ellipse cx="12" cy="6.6" rx="2.3" ry="3.2"/><ellipse cx="12" cy="17.4" rx="2.3" ry="3.2"/><ellipse cx="6.6" cy="12" rx="3.2" ry="2.3"/><ellipse cx="17.4" cy="12" rx="3.2" ry="2.3"/>`,
  sekki:    `<path d="M2.5 18.5h19"/><path d="M6 18.5a6 6 0 0 1 12 0"/><path d="M12 5.5v-3M4.6 9.1 2.9 7.4M19.4 9.1l1.7-1.7"/>`,
  season:   `<path d="M3.5 11h17a8.5 8.5 0 0 1-17 0Z"/><path d="M6.5 21h11"/><path d="M12 7.5c-2 0-2-2 0-3.5"/><path d="M15.5 7.5c-1.6 0-1.6-1.6 0-2.8"/>`,
  dish:     `<circle cx="10.5" cy="12" r="7.5"/><circle cx="10.5" cy="12" r="4"/><path d="M20.5 4.5v15"/><path d="M20.5 4.5c-1.6 1-1.6 4.5 0 5.5"/>`,
  pot:      `<path d="M5 10.5h14l-1.4 8.2a2 2 0 0 1-2 1.8H8.4a2 2 0 0 1-2-1.8Z"/><path d="M12 10.5V7"/><path d="M12 8.6C9.6 8.6 8 7 8 4.6c2.4 0 4 1.6 4 4Z"/><path d="M12.6 8c0-2 1.4-3.4 3.6-3.4 0 2-1.4 3.4-3.6 3.4Z"/>`,
  bulb:     `<path d="M9 17.5h6"/><path d="M9.8 20.5h4.4"/><path d="M12 3.5a6 6 0 0 0-3.4 10.9c.5.4.8 1 .8 1.6h5.2c0-.6.3-1.2.8-1.6A6 6 0 0 0 12 3.5Z"/>`,
  cam:      `<path d="M3.5 8.2h3.2l1.6-2.4h7.4l1.6 2.4h3.2v11H3.5Z"/><circle cx="12" cy="13.4" r="3.6"/>`,
  drop:     `<path d="M12 3.6c3.4 4 5.4 6.7 5.4 9.3a5.4 5.4 0 0 1-10.8 0c0-2.6 2-5.3 5.4-9.3Z"/>`,
  /* 状態を表す記号。色が見分けにくくても形で判別できる */
  ok:       `<path d="M4.5 12.5 9.5 17.5 19.5 6.5"/>`,
  good:     `<circle cx="12" cy="12" r="8.6"/><circle cx="12" cy="12" r="3.4"/>`,
  warn:     `<path d="M12 3.8 21.5 20H2.5Z"/><path d="M12 10v4.2M12 17.2v.6"/>`,
  bad:      `<circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.2v.6"/>`,
  q:        `<circle cx="12" cy="12" r="9"/><path d="M9.4 9.4a2.7 2.7 0 0 1 5.2.9c0 1.8-2.6 2.2-2.6 3.9M12 17.2v.6"/>`,
};

function icon(name, cls){
  return `<svg class="ic ${cls || ""}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[name] || ""}</svg>`;
}

/* ===================== 月ごとの意匠 ===================== */
/* 花や結晶を図形の組み合わせで描く。写真を使わないので軽く、季節で色も変わる */
const MOTIF = [
  {c:"#6E8CA0", t:"snow"},                          // 1月 雪の結晶
  {c:"#9C7B8E", t:"flower", n:5, rx:8,  ry:8},      // 2月 梅
  {c:"#C08A96", t:"flower", n:5, rx:6,  ry:12},     // 3月 桜
  {c:"#B96A5E", t:"tulip"},                         // 4月 チューリップ
  {c:"#6F9A57", t:"leaf"},                          // 5月 若葉
  {c:"#6E7FA8", t:"cluster"},                       // 6月 紫陽花
  {c:"#C89A2E", t:"flower", n:16, rx:5, ry:15},     // 7月 向日葵
  {c:"#7A73B0", t:"morning"},                       // 8月 朝顔
  {c:"#B07E96", t:"flower", n:8, rx:4,  ry:16},     // 9月 コスモス
  {c:"#C4863C", t:"branch"},                        // 10月 金木犀
  {c:"#A05A4A", t:"flower", n:24, rx:2, ry:18},     // 11月 菊
  {c:"#9B5C74", t:"cyclamen"},                      // 12月 シクラメン
];

function drawMotif(m){
  const S = 'fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"';
  let g = "";
  if (m.t === "flower"){
    for (let i = 0; i < m.n; i++){
      g += `<ellipse cx="50" cy="${50 - m.ry - 4}" rx="${m.rx}" ry="${m.ry}" ${S} transform="rotate(${360 / m.n * i} 50 50)"/>`;
    }
    g += `<circle cx="50" cy="50" r="6" ${S}/>`;
  } else if (m.t === "snow"){
    for (let i = 0; i < 6; i++){
      g += `<g transform="rotate(${60 * i} 50 50)"><path d="M50 50 V14" ${S}/><path d="M50 24 l7 7 M50 24 l-7 7 M50 36 l6 6 M50 36 l-6 6" ${S}/></g>`;
    }
  } else if (m.t === "tulip"){
    g += `<path d="M34 40 q0 26 16 34 q16-8 16-34 q-8 8-16 2 q-8 6-16-2Z" ${S}/>
          <path d="M50 74 V96" ${S}/><path d="M50 84 q-18-4-22-18 q16-2 22 10" ${S}/>`;
  } else if (m.t === "leaf"){
    g += `<path d="M50 92 C22 74 20 40 50 12 C80 40 78 74 50 92Z" ${S}/><path d="M50 90 V20" ${S}/>
          <path d="M50 44 l-16-12 M50 44 l16-12 M50 64 l-14-11 M50 64 l14-11" ${S}/>`;
  } else if (m.t === "cluster"){
    const pts = [[50,26],[32,42],[68,42],[41,64],[59,64],[50,46]];
    pts.forEach(([x,y]) => {
      for (let i = 0; i < 4; i++) g += `<ellipse cx="${x}" cy="${y - 9}" rx="5" ry="7" ${S} transform="rotate(${90 * i} ${x} ${y})"/>`;
    });
  } else if (m.t === "morning"){
    g += `<circle cx="50" cy="44" r="27" ${S}/><circle cx="50" cy="44" r="9" ${S}/>`;
    for (let i = 0; i < 5; i++) g += `<path d="M50 44 L50 17" ${S} transform="rotate(${72 * i} 50 44)"/>`;
    g += `<path d="M50 71 q6 14-6 20 q-12 4-8-6 q4-8 12-4" ${S}/>`;
  } else if (m.t === "branch"){
    g += `<path d="M20 84 Q46 60 82 22" ${S}/>`;
    [[36,70],[52,54],[68,38],[44,62],[60,46]].forEach(([x,y]) => {
      for (let i = 0; i < 4; i++) g += `<ellipse cx="${x}" cy="${y - 5}" rx="3" ry="4" ${S} transform="rotate(${90 * i} ${x} ${y})"/>`;
    });
  } else if (m.t === "cyclamen"){
    for (let i = 0; i < 5; i++){
      g += `<path d="M50 52 q-7-22 0-34 q7 12 0 34" ${S} transform="rotate(${(i - 2) * 26} 50 52)"/>`;
    }
    g += `<path d="M50 52 V94" ${S}/><path d="M50 88 q-20-2-24-16 q18-4 24 8" ${S}/>`;
  }
  return g;
}

/* 2色を混ぜる。季節色をどれだけ効かせるかを比率で指定する */
function mix(hex, base, ratio){
  const p = (h) => [1,3,5].map(i => parseInt(h.slice(i, i + 2), 16));
  const [r1,g1,b1] = p(hex), [r2,g2,b2] = p(base);
  const v = (a, b) => Math.round(a * ratio + b * (1 - ratio)).toString(16).padStart(2, "0");
  return `#${v(r1,r2)}${v(g1,g2)}${v(b1,b2)}`;
}

let PAPER = "#F7F9F4";   /* いまの地色。札の淡い背景を作るのに使う */

function applySeasonStyle(month){
  const m = MOTIF[month], c = m.c;
  const root = document.documentElement.style;
  /* 地色は淡く、文字は濃く。同じ季節色から全体を組み立てる */
  PAPER = mix(c, "#F7F9F4", .07);
  root.setProperty("--accent", c);
  root.setProperty("--accent-soft", c + "26");
  root.setProperty("--paper", PAPER);
  root.setProperty("--card", mix(c, "#FFFFFF", .045));
  root.setProperty("--ink", mix(c, "#1B2A20", .20));
  root.setProperty("--ink-soft", mix(c, "#525F55", .24));
  root.setProperty("--line", mix(c, "#DCE3D6", .28));
  root.setProperty("--sky", mix(c, "#E8F1F6", .14));
  root.setProperty("--title", mix(c, "#1B2A20", .52));
  const g = drawMotif(m);
  $("#motif").innerHTML = g;
  $("#motif2").innerHTML = g;
  $("#motif3").innerHTML = g;
}

/* ===================== 日本の祝日 ===================== */
function holidays(y){
  const H = new Map();
  const set = (m, d, n) => H.set(`${y}-${pad(m)}-${pad(d)}`, n);
  const nthMon = (m, n) => 1 + ((8 - new Date(y, m - 1, 1).getDay()) % 7) + (n - 1) * 7;

  set(1, 1, "元日");            set(1, nthMon(1, 2), "成人の日");
  set(2, 11, "建国記念の日");    set(2, 23, "天皇誕生日");
  set(4, 29, "昭和の日");
  set(5, 3, "憲法記念日");       set(5, 4, "みどりの日");      set(5, 5, "こどもの日");
  set(7, nthMon(7, 3), "海の日");
  set(8, 11, "山の日");
  set(9, nthMon(9, 3), "敬老の日");
  set(10, nthMon(10, 2), "スポーツの日");
  set(11, 3, "文化の日");        set(11, 23, "勤労感謝の日");

  /* 春分・秋分は年ごとに動くため近似式で求める（1980〜2099年に有効） */
  const eq = (a) => Math.floor(a + 0.242194 * (y - 1980) - Math.floor((y - 1980) / 4));
  set(3, eq(20.8431), "春分の日");
  const shubun = eq(23.2488);
  set(9, shubun, "秋分の日");

  /* 敬老の日と秋分の日に挟まれた平日は国民の休日になる */
  const keiro = nthMon(9, 3);
  if (shubun - keiro === 2) set(9, keiro + 1, "国民の休日");

  /* 日曜と重なった祝日は、次の平日が振替休日になる */
  [...H.keys()].forEach(k => {
    const d = new Date(k + "T00:00:00");
    if (d.getDay() !== 0) return;
    let n = new Date(d);
    do { n.setDate(n.getDate() + 1); } while (H.has(`${y}-${pad(n.getMonth()+1)}-${pad(n.getDate())}`));
    set(n.getMonth() + 1, n.getDate(), "振替休日");
  });
  return H;
}

/* ===================== 天気 ===================== */
async function loadWeather(){
  const q = new URLSearchParams({
    latitude:LAT, longitude:LON, timezone:"Asia/Tokyo", forecast_days:"7",
    current:"temperature_2m,apparent_temperature,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m,precipitation",
    hourly:"temperature_2m,precipitation_probability,precipitation,weather_code,wind_direction_10m",
    daily:"weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_speed_10m_max,wind_direction_10m_dominant"
  });

  let d;
  try {
    const r = await fetch("https://api.open-meteo.com/v1/forecast?" + q);
    if (!r.ok) throw new Error("HTTP " + r.status);
    d = await r.json();
  } catch(e){
    $("#weather").innerHTML = `<h2><span class="t">${icon("sky")}空のようす</span><em>取得できず</em></h2>
      <div class="state err"><b>天気を取得できませんでした</b>
      <span>通信の状態を確認して、もう一度お試しください。（${esc(e.message)}）</span></div>`;
    return;
  }

  const c = d.current, H = d.hourly, D = d.daily;
  let h = `<h2><span class="t">${icon("sky")}空のようす</span><em>三郷市・Open-Meteo</em></h2>`;

  h += `<div class="now">
    <div class="lead">
      <div class="ic">${W_ICON[c.weather_code] || "🌡️"}</div>
      <div>
        <div class="tp">${Math.round(c.temperature_2m)}<small>°C</small></div>
        <div class="cond">${W_NAME[c.weather_code] || "—"}　体感 ${Math.round(c.apparent_temperature)}°C</div>
      </div>
    </div>
    <div class="metrics">
      <div class="m"><b>${c.relative_humidity_2m}<small>%</small></b><span>湿度</span></div>
      <div class="m"><b>${c.precipitation}<small>mm</small></b><span>降水量</span></div>
      <div class="m"><b>${c.wind_speed_10m.toFixed(1)}<small>m/s</small></b><span>風速</span></div>
      <div class="m"><b>${wind(c.wind_direction_10m)}</b><span>風向</span></div>
    </div>
  </div>`;

  /* 3時間ごとに8つ。横スクロールなしで24時間ぶんが収まる */
  const nowH = (c.time || "").slice(0, 13);
  let i0 = H.time.findIndex(t => t.slice(0, 13) >= nowH);
  if (i0 < 0) i0 = 0;

  /* 見出しに出す24時間の総雨量は、3時間おきではなく全時刻を足す */
  let sum24 = 0, maxP = 0;
  for (let i = i0; i < Math.min(i0 + 24, H.time.length); i++){
    sum24 += H.precipitation?.[i] || 0;
    maxP = Math.max(maxP, H.precipitation_probability?.[i] ?? 0);
  }

  let cells = "";
  for (let k = 0; k < 8; k++){
    const i = i0 + k * 3;
    if (i >= H.time.length) break;
    const dt = new Date(H.time[i]), hh = dt.getHours();
    const pp = H.precipitation_probability?.[i] ?? 0;
    /* この列が受け持つ3時間ぶんの雨量をまとめる */
    let mm = 0;
    for (let j = i; j < Math.min(i + 3, H.time.length); j++) mm += H.precipitation?.[j] || 0;
    cells += `<div class="hr${(hh < 6 || hh >= 19) ? " night" : ""}">
      <div class="t">${k === 0 ? "今" : hh + "時"}</div>
      <div class="i">${W_ICON[H.weather_code[i]] || "・"}</div>
      <div class="d">${Math.round(H.temperature_2m[i])}°</div>
      <div class="p">${pp >= 10 ? pp + "%" : ""}</div>
      <div class="mm">${mm >= 0.1 ? mm.toFixed(1) + "mm" : ""}</div>
      <div class="w"><span class="arw" style="transform:rotate(${(H.wind_direction_10m[i] + 180) % 360}deg)">↑</span></div>
    </div>`;
  }
  h += `<details><summary>これから24時間　3時間ごと${maxP >= 30 ? `・最大降水確率 ${maxP}%` : ""}${sum24 >= 0.1 ? `・雨量 ${sum24.toFixed(1)}mm` : ""}</summary>
    <div class="hours">${cells}</div>
    <div class="body" style="padding-top:10px;font-size:11px;color:var(--ink-soft)">青い数字は降水確率、その下は3時間ぶんの雨量、矢印は風の向きです。</div></details>`;

  /* 週間 */
  const lo = Math.min(...D.temperature_2m_min), hi = Math.max(...D.temperature_2m_max);
  const span = Math.max(hi - lo, 1);
  const hol = holidays(new Date().getFullYear());
  let rows = "";
  D.time.forEach((t, i) => {
    const dt = new Date(t + "T00:00:00"), w = dt.getDay();
    const isHol = hol.has(t);
    const mn = D.temperature_2m_min[i], mx = D.temperature_2m_max[i];
    const pp = D.precipitation_probability_max?.[i] ?? 0;
    const ps = D.precipitation_sum?.[i] ?? 0;
    rows += `<div class="wc dy ${isHol || w === 0 ? "sun" : w === 6 ? "sat" : ""}" ${isHol ? `title="${hol.get(t)}"` : ""}>${i === 0 ? "今日" : DOW[w] + "曜"}<s>${dt.getMonth()+1}/${dt.getDate()}</s></div>
      <div class="wc ic">${W_ICON[D.weather_code[i]] || "・"}</div>
      <div class="wc pp"><b>${pp >= 10 ? pp + "%" : ""}</b><s>${ps >= 0.1 ? ps.toFixed(1) + "mm" : ""}</s></div>
      <div class="wc rng"><span>${Math.round(mn)}°</span>
        <span class="track"><span class="fill" style="left:${(mn-lo)/span*100}%;width:${Math.max((mx-mn)/span*100,4)}%"></span></span>
        <b>${Math.round(mx)}°</b></div>
      <div class="wc wd">${D.wind_speed_10m_max[i].toFixed(0)}m/s ${wind(D.wind_direction_10m_dominant[i])}</div>`;
  });
  const rain7 = (D.precipitation_sum || []).reduce((a, b) => a + (b || 0), 0);
  h += `<details><summary>この先一週間　${Math.round(Math.min(...D.temperature_2m_min))}°〜${Math.round(Math.max(...D.temperature_2m_max))}°${rain7 >= 0.1 ? `・雨量 ${rain7.toFixed(0)}mm` : ""}</summary>
    <div class="body"><div class="week">${rows}</div></div></details>`;

  $("#weather").innerHTML = h;
}

/* ===================== 作業の申告 ===================== */
const HOOK = "https://hook.us2.make.com/p985gwt6eq9wgqhcvadd9a9v9ih1i5da";
const WORKS = ["💧水やり", "🧺収穫", "✂️剪定", "🌱追肥", "👀観察のみ"];

/* 「すぐに確認してください」で確認した記録。
   Notion → GitHub の反映には少し時間がかかるので、その間の再描画で
   消したはずの行が戻ってこないよう、こちらで覚えておく */
const SEEN = new Set();

function logBox(p){
  if (!p.record_id) return "";
  /* 判別不能は撮り直しが先。記録すべき作業がないので申告欄は出さない */
  if (p.health === "判別不能") return "";
  const done = (p.works || []);
  return `<div class="log" data-id="${esc(p.record_id)}" data-plant="${esc(p.name)}"
    data-when="${esc(p.last_record || "")}"
    data-status="${esc(p.status || "")}" data-water="${esc(p.last_watered || "")}"
    data-done="${esc(done.join(","))}">${shutView(done, p.last_record)}</div>`;
}

/* 「8/10の提案」のように、どの記録に対する話かを添える */
function whenLabel(d){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(d || "");
  return m ? `${+m[2]}/${+m[3]}の提案` : "AIの提案";
}

/* 閉じているときの見た目 */
function shutView(done, when){
  const w = whenLabel(when);
  if (done.length){
    return `<button class="open" type="button">対応を修正する</button>
      <div class="msg done">${icon("ok")}<span>${esc(w)}に対応　${esc(done.join("・"))}</span></div>`;
  }
  return `<button class="open lead" type="button">対応を記録する</button>
    <div class="msg todo">${esc(w)}はまだ記録していません</div>`;
}

function closeLog(box){
  box.innerHTML = shutView((box.dataset.done || "").split(",").filter(Boolean), box.dataset.when);
  /* 申告中に届いていたデータがあれば、ここで反映する */
  if (WAITING && !isBusy()){
    const d = WAITING; WAITING = null;
    STAMP = d.generated_at || "";
    paint(d, true);
  }
}

function openLog(box){
  const done = (box.dataset.done || "").split(",").filter(Boolean);
  const picks = WORKS.map(w =>
    `<button class="pick" type="button" data-w="${esc(w)}" aria-pressed="${done.includes(w)}">${esc(w)}</button>`
  ).join("");
  box.innerHTML = `<div class="picks">${picks}</div>
    <div class="row">
      <button class="send" type="button">記録する</button>
      <button class="cancel" type="button">やめる</button>
    </div>
    <div class="msg"></div>`;
}

async function sendLog(box){
  const chosen = [...box.querySelectorAll('.pick[aria-pressed="true"]')].map(b => b.dataset.w);
  const msg = box.querySelector(".msg");
  const send = box.querySelector(".send");
  send.disabled = true;
  msg.className = "msg";
  msg.style.color = "var(--ink-soft)";
  msg.textContent = "送信しています…";

  try {
    /* 相手の応答を待たない形式で送る。ブラウザの制約を避けるための方法 */
    await fetch(HOOK, {
      method: "POST",
      mode: "no-cors",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        record_id: box.dataset.id,
        plant: box.dataset.plant,
        works: chosen.join(","),
        /* 送らないとNotion側が空になるため、変えない値もそのまま送り返す */
        status: box.dataset.status || "未対応",
        last_watered: box.dataset.water || "",
      }),
    });
    box.dataset.done = chosen.join(",");
    /* Notionの反映を待たず、その場でカードの見た目を変える */
    const card = box.closest(".card");
    if (card) card.classList.toggle("logged", chosen.length > 0);
    box.innerHTML = shutView(chosen, box.dataset.when)
      + `<div class="msg sent">送信しました。Notionにも反映されます。</div>`;
  } catch(e) {
    msg.className = "msg ng";
    msg.textContent = "送信できませんでした。通信を確認してください。";
    send.disabled = false;
  }
}

/* 「すぐに確認してください」の行を確認済みにする。
   Notionの対応ステータスを「対応不要」に変えるだけで、株のカードは今までどおり残る */
async function sendSeen(btn){
  const id = btn.dataset.id;
  btn.disabled = true;
  try {
    await fetch(HOOK, {
      method: "POST",
      mode: "no-cors",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        record_id: id,
        plant: btn.dataset.plant,
        status: "対応不要",
        /* 作業と水やりの記録は変えない。現状をそのまま送り返す */
        works: btn.dataset.works || "",
        last_watered: btn.dataset.water || "",
      }),
    });
    SEEN.add(id);
    const line = btn.closest(".line");
    if (line) line.remove();
    /* 行が全部なくなったら、欄ごと閉じる */
    const box = $("#app").querySelector(".critical");
    if (box && !box.querySelector(".line")) box.remove();
  } catch(e) {
    btn.disabled = false;
  }
}

/* ===================== 栽培記録 ===================== */
let RECORDS = [];
let ACTIVE = [];
let CAL = null;          /* 表示中の年月 */
let PICKED = null;       /* 選ばれている日 */
let BOUND = false;       /* 操作の受け取りを一度だけ設定するための印 */
let ONLY = false;        /* 要対応だけに絞っているかどうか。描き直しても保つ */

/* 絞り込みの状態を画面に反映する。描画のたびに呼ぶ */
function applyOnly(){
  const grid = $("#app").querySelector(".plants");
  if (!grid) return;
  const n = grid.querySelectorAll(".card.attn").length;
  const all = grid.querySelectorAll(".card").length;
  grid.classList.toggle("only", ONLY);
  const jump = $("#app").querySelector(".jump");
  if (jump) jump.innerHTML = ONLY ? "すべての株を表示" : `うち<b>${n}</b>株が要対応`;
  const note = $("#app").querySelector(".only-note");
  if (note){
    note.textContent = `要対応の${n}株だけを表示中（栽培中は${all}株）`;
    note.style.display = ONLY ? "block" : "none";
  }
}

function gauge(days, need){
  /* 水やりが要るときは、この行を水の色と滴の記号で示す */
  const lb = need ? `<span class="lb">${icon("drop")}最終水やり</span>` : `<span class="lb">最終水やり</span>`;
  if (days == null){
    return `<div class="gauge"><div class="row ${need ? "need" : ""}">${lb}<span class="val">記録なし</span></div>
      <div class="bar">${"<i></i>".repeat(7)}</div></div>`;
  }
  const filled = Math.max(0, 7 - Math.min(days, 7));
  let cells = "";
  for (let i = 0; i < 7; i++) cells += `<i class="${i < filled ? "on" : ""}"></i>`;
  return `<div class="gauge">
    <div class="row ${need ? "need" : ""}">${lb}<span class="val">${days === 0 ? "今日" : days + "日前"}</span></div>
    <div class="bar${days >= 4 ? " thirsty" : ""}">${cells}</div></div>`;
}

/* 今日の日付。判定と表示で共用する */
function todayStr(){
  const t = new Date();
  return `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`;
}

/* 要対応の理由。急ぎの重い順に並べる。
   判別不能は「撮り直せば分かる」だけなので、要対応には数えず案内だけ出す */
function reasons(p){
  const r = [];
  const ts = todayStr();
  if (p.health === "異常") r.push("状態が異常です");
  if (p.due && p.status === "未対応"){
    if (p.due < ts) r.push("対応期限を過ぎています");
    else if (p.due === ts) r.push("today");
  }
  if (p.harvest === "急ぎ") r.push("収穫が急ぎです");
  if (p.watering === "必要") r.push("水やりが必要です");
  if (p.health === "注意") r.push("状態が注意です");
  return r.map(x => x === "today" ? "今日が対応期限です" : x);
}
const hc = (h) => ["良好","注意","異常","判別不能"].includes(h) ? h : "unknown";
const HICON = {良好:"good", 注意:"warn", 異常:"bad", 判別不能:"cam", unknown:"q"};
/* 状態の札。色と記号の両方で示す */
const badge = (h) => `<span class="badge ${hc(h)}">${icon(HICON[hc(h)])}${esc(h || "未判定")}</span>`;
const pill  = (h) => `<span class="pill ${hc(h)}">${icon(HICON[hc(h)])}${esc(h)}</span>`;

function calendar(){
  const now = new Date();
  const y = CAL.y, m = CAL.m;
  const isThis = (y === now.getFullYear() && m === now.getMonth());
  const first = new Date(y, m, 1).getDay(), last = new Date(y, m + 1, 0).getDate();
  const hol = holidays(y);

  /* その日の記録をまとめ、最も重い健康状態で帯の色を決める */
  const byDay = {};
  RECORDS.forEach(r => { if (r.date) (byDay[r.date] = byDay[r.date] || []).push(r); });

  /* 記録が残っている範囲を求め、その外へは進めないようにする */
  const days = Object.keys(byDay).sort();
  const oldest = days[0] || "", newest = days[days.length - 1] || "";
  const cur = `${y}-${pad(m + 1)}`;
  const canPrev = oldest && cur > oldest.slice(0, 7);
  const canNext = !isThis;

  let g = "";
  DOW.forEach((d, i) => { g += `<div class="dow ${i === 0 ? "sun" : i === 6 ? "sat" : ""}">${d}</div>`; });
  for (let i = 0; i < first; i++) g += `<div class="dd empty">0</div>`;

  let hits = 0;
  for (let d = 1; d <= last; d++){
    const key = `${y}-${pad(m + 1)}-${pad(d)}`;
    const w = (first + d - 1) % 7;
    const hn = hol.get(key);
    const rs = byDay[key] || [];
    if (rs.length) hits++;
    const worst = rs.some(r => r.health === "異常") ? "bad" : rs.some(r => r.health === "注意") ? "warn" : "";
    const isToday = isThis && d === now.getDate();
    const cls = ["dd", isToday ? "today" : "", rs.length ? "hit" : "", worst,
                 key === PICKED ? "on" : "",
                 (hn || w === 0) ? "hol" : w === 6 ? "sat" : ""].filter(Boolean).join(" ");
    g += rs.length
      ? `<button class="${cls}" data-day="${key}" type="button" ${hn ? `title="${hn}"` : ""}>${d}</button>`
      : `<div class="${cls}" ${hn ? `title="${hn}"` : ""}>${d}</div>`;
  }

  return `<div class="cal">
    <div class="hd">
      <div class="mn">${y}年 ${m + 1}月　<span style="font-size:11px;color:var(--ink-soft);letter-spacing:.06em">記録${hits}日</span></div>
      <div class="nav">
        <button type="button" data-mv="-1" ${canPrev ? "" : "disabled"}>前の月</button>
        <button type="button" data-mv="0" ${isThis ? "disabled" : ""}>今月</button>
        <button type="button" data-mv="1" ${canNext ? "" : "disabled"}>次の月</button>
      </div>
    </div>
    <div class="grid">${g}</div>
    <div class="lg">
      <span><i></i>良好のみ</span><span><i class="warn"></i>注意あり</span><span><i class="bad"></i>異常あり</span>
      <span>色の帯がある日をおすと、その日の記録が開きます</span>
    </div><div id="daybox"></div></div>`;
}

function paintCalendar(){
  const box = $("#calwrap");
  if (!box) return;
  box.innerHTML = calendar();
  if (PICKED) showDay(PICKED);
}

function showDay(key){
  const rs = RECORDS.filter(r => r.date === key);
  if (!rs.length) return;
  PICKED = key;
  const dt = new Date(key + "T00:00:00");
  let h = `<div class="daybox"><h5>${dt.getMonth()+1}月${dt.getDate()}日（${DOW[dt.getDay()]}）の記録　${rs.length}件</h5>`;
  rs.forEach(r => {
    h += `<div class="rw"><b>${esc(r.plant || "—")}</b>
      ${r.health ? pill(r.health) : ""}
      <span>${esc(r.action || r.ai_comment || "コメントなし").slice(0, 90)}</span></div>`;
  });
  const box = $("#daybox");
  if (box) box.innerHTML = h + `</div>`;
  document.querySelectorAll(".cal .dd.on").forEach(e => e.classList.remove("on"));
  document.querySelector(`.cal .dd[data-day="${key}"]`)?.classList.add("on");
}

function render(d){
  const s = d.stats || {};
  RECORDS = d.records || [];
  ACTIVE = (d.plants || []).map(p => p.name || "");
  if (!CAL){
    const n = new Date();
    CAL = {y:n.getFullYear(), m:n.getMonth()};
  }
  $("#stamp").textContent = "最終同期 " + (d.generated_at || "").replace("T", " ").slice(0, 16);

  /* ① 株のようす。要対応は「理由がひとつでもある株」と数える */
  const att = (d.plants || []).filter(p => reasons(p).length).length;
  const anyBad = (d.plants || []).some(p => p.health === "異常");
  let h = `<section><h2><span class="t">${icon("sprout")}株のようす</span><em>急ぎの順</em></h2>
    <div class="tally">
      <span><b>${s.plants_active ?? 0}</b>株を栽培中</span>
      <span class="${att > 0 ? "hot" : ""}${anyBad ? " bad" : ""}">${att > 0 ? `<button class="jump" type="button">うち<b>${att}</b>株が要対応</button>` : "対応が必要な株はなし"}</span>
      <span>今週の記録<b>${s.records_7d ?? 0}</b>件</span>
      <span>通算<b>${s.total_records ?? 0}</b>件</span>
    </div>`;

  /* 「確認した」を押した行は、Notionの反映が届くまでの間だけ画面から伏せておく */
  const cr = (d.critical || []).filter(c => !SEEN.has(c.record_id));
  if (cr.length){
    h += `<div class="critical"><h3>すぐに確認してください</h3>`;
    cr.forEach(c => {
      /* 古い data.json には why が無いので、その場合は従来の文をそのまま使う */
      const body = c.why
        ? `<span class="rsn">${esc(c.why)}</span>${esc(c.action || "")}`
        : esc(c.message || "");
      const seen = c.record_id
        ? `<button class="seen" type="button" data-id="${esc(c.record_id)}"
             data-plant="${esc(c.plant)}" data-works="${esc((c.works || []).join(","))}"
             data-water="${esc(c.last_watered || "")}">${icon("ok")}確認した</button>`
        : "";
      h += `<div class="line"><p><b>${esc(c.plant)}</b>　${body}</p>${seen}</div>`;
    });
    if (d.critical_more > 0){
      h += `<p class="more">ほか${d.critical_more}株にも対応が必要です。下の一覧をご覧ください。</p>`;
    }
    h += `</div>`;
  }

  const pl = d.plants || [];
  if (!pl.length){
    h += `<div class="state">栽培中の株がありません。</div>`;
  } else {
    h += `<div class="only-note${anyBad ? " bad" : ""}"></div><div class="plants">`;
    pl.forEach(p => {
      const rs = reasons(p);
      const cam = p.health === "判別不能";
      const why = cam
        ? `<div class="why cam">${icon("cam")}<span>写真を撮り直してください</span></div>`
        : (rs.length
          ? `<div class="why ${p.health === "異常" ? "bad" : ""}">${icon(p.health === "異常" ? "bad" : "warn")}<span>${esc(rs.join("・"))}</span></div>`
          : "");
      h += `<div class="card u${p.urgency ?? 5} s${hc(p.health)}${rs.length ? " attn" : ""}${(p.works || []).length ? " logged" : ""}">
        <div class="top">
          <div><div class="nm">${esc(p.name)}</div><div class="phase">${esc(p.phase || "フェーズ未設定")}</div></div>
          <div class="marks"><span class="done-chip${(p.last_record && p.last_record !== todayStr()) ? " old" : ""}">${icon("ok")}${esc(p.last_record && p.last_record !== todayStr() ? whenLabel(p.last_record).replace("の提案", "") + "済" : "済")}</span>${badge(p.health)}</div>
        </div>
        ${why}
        ${gauge(p.days_since_water, p.watering === "必要")}
        <div class="note">
          ${p.ai_comment ? `<div class="see"><b>見立て</b>　${esc(p.ai_comment)}</div>` : ""}
          ${p.action ? `<div class="act"><b>次の一手</b>　${esc(p.action)}</div>`
            : (p.ai_comment ? "" : `<div class="act">コメントはまだありません。</div>`)}
        </div>
        ${logBox(p)}
      </div>`;
    });
    h += `</div>`;
  }
  h += `</section>`;

  const app = $("#app");
  app.className = "fade";
  app.innerHTML = h;

  /* 作業申告の操作。カードは描き直されるので、まとめて受け取る */
  if (!BOUND) app.addEventListener("click", (ev) => {
    /* 要対応の数を押すと、その株だけに絞る。もう一度押すと元に戻る */
    const jump = ev.target.closest(".jump");
    if (jump){ ONLY = !ONLY; applyOnly(); return; }
    const seen = ev.target.closest(".critical .seen");
    if (seen){ sendSeen(seen); return; }
    const box = ev.target.closest(".log");
    if (!box) return;
    if (ev.target.closest(".open"))   { openLog(box); return; }
    if (ev.target.closest(".cancel")) { closeLog(box); return; }
    if (ev.target.closest(".send"))   { sendLog(box); return; }
    const pick = ev.target.closest(".pick");
    if (pick) pick.setAttribute("aria-pressed", pick.getAttribute("aria-pressed") !== "true");
  });

  /* ③〜⑤ 天気のうしろに置くもの */
  let t = `<section><h2><span class="t">${icon("calendar")}記録カレンダー</span><em>月をまたいで見られます</em></h2>
    <details><summary>記録のあった日を見る</summary><div class="body" id="calwrap"></div></details></section>`;

  const skip = new Set(d.archived_names || []);
  const rc = RECORDS.filter(r => !skip.has(r.plant)).slice(0, 20);
  t += `<section><h2><span class="t">${icon("list")}直近の記録</span><em>栽培中の株</em></h2>
    <details><summary>新しい順に${rc.length}件</summary><div class="body">
    <table><thead><tr><th>日付</th><th>株</th><th>状態</th><th>水やり</th><th class="w">作業</th></tr></thead><tbody>`;
  rc.forEach(r => {
    const works = (r.works && r.works.length) ? r.works.join("・") : "—";
    t += `<tr><td class="d">${esc((r.date || "").replace(/-/g, "."))}</td>
      <td class="p">${esc(r.plant || "—")}</td>
      <td>${r.health ? pill(r.health) : "—"}</td>
      <td class="d">${esc(r.watering || "—")}</td>
      <td class="w">${esc(works)}</td></tr>`;
  });
  t += `</tbody></table></div></details>
    <div class="foot"><span>過去の株を含むすべての記録はNotionにあります。</span>
    <a href="${DB_URL}" target="_blank" rel="noopener">栽培記録をNotionで開く</a></div></section>`;

  const ar = d.archived || [];
  if (ar.length){
    t += `<section><h2><span class="t">${icon("archive")}過去の株</span><em>${d.archive_days ?? 30}日以上記録なし</em></h2>
      <details><summary>栽培を終えた${ar.length}株</summary><div class="body past">`;
    ar.forEach(p => {
      t += `<div class="r"><b>${esc(p.name)}</b>
        <span>最後の記録　${esc((p.last_record || "").replace(/-/g, "."))}（${p.days_since_record}日前）</span></div>`;
    });
    t += `</div></details></section>`;
  }
  $("#tail").innerHTML = t;
  paintCalendar();
  renderSeason();   /* 育てている株が分かってから料理を選び直す */

  if (!BOUND) $("#tail").addEventListener("click", (ev) => {
    const day = ev.target.closest("[data-day]");
    if (day){ showDay(day.dataset.day); return; }

    const mv = ev.target.closest("[data-mv]");
    if (!mv) return;
    const step = Number(mv.dataset.mv);
    if (step === 0){
      const n = new Date();
      CAL = {y:n.getFullYear(), m:n.getMonth()};
    } else {
      const d = new Date(CAL.y, CAL.m + step, 1);
      CAL = {y:d.getFullYear(), m:d.getMonth()};
    }
    PICKED = null;
    paintCalendar();
  });

  BOUND = true;
}

/* ===================== 栽培データの読み込み ===================== */
/* 30秒ごとに data.json を見に行き、中身が変わっていたら描き直す。
   撮影の直後にダッシュボードを開いても、待たずに新しい記録へ切り替わる */

let STAMP = "";          /* いま画面に出しているデータの生成時刻 */
let WAITING = null;      /* 申告の途中で届いたデータを、いったん預かる場所 */

/* 作業を選んでいる最中は描き直さない。選択が消えてしまうため */
const isBusy = () => !!$("#app").querySelector(".log .pick");

function paint(d, quiet){
  render(d);
  applyOnly();
  if (quiet) flash();
}

/* 新しい記録が届いたことを知らせる。30秒で消え、触っても消える */
function flash(){
  const el = $("#fresh");
  if (!el) return;
  el.style.display = "block";
  clearTimeout(flash.t);
  flash.t = setTimeout(() => { el.style.display = "none"; }, 30 * 1000);
}

async function loadGarden(quiet){
  if (!quiet) $("#app").innerHTML = `<div class="state">Notionのデータを取得しています…</div>`;
  const routes = ["data.json", "https://natsume0703.github.io/garden-dashboard/data.json"];
  let last = "";
  for (const url of routes){
    try {
      const res = await fetch(url + "?t=" + Date.now(), {cache:"no-store"});
      if (!res.ok) throw new Error("HTTP " + res.status);
      const d = await res.json();
      const st = d.generated_at || "";
      if (quiet && st === STAMP) return;      /* 変わっていなければ触らない */
      if (quiet && isBusy()){ WAITING = d; return; }  /* 申告中なら預かる */
      STAMP = st;
      paint(d, quiet);
      return;
    } catch(e){ last = e.message; }
  }
  if (quiet) return;                          /* 裏での確認が失敗しても画面は壊さない */
  $("#stamp").textContent = "同期できていません";
  $("#app").innerHTML = `<section><div class="state err"><b>栽培データを読み込めませんでした</b>
    <span>GitHub Actions の同期が一度も成功していない場合は、Actions タブから「Sync Notion to data.json」を実行してください。（${esc(last)}）</span></div></section>`;
}

/* ===================== 起動 ===================== */
const n0 = new Date();
const hol0 = holidays(n0.getFullYear());
const key0 = `${n0.getFullYear()}-${pad(n0.getMonth()+1)}-${pad(n0.getDate())}`;
$("#today").innerHTML = `${n0.getFullYear()}年${n0.getMonth()+1}月${n0.getDate()}日（${DOW[n0.getDay()]}）`
  + (hol0.has(key0) ? `<span class="hol">　${hol0.get(key0)}</span>` : "");

applySeasonStyle(n0.getMonth());
renderSeason();
$("#reload").addEventListener("click", () => { loadWeather(); loadGarden(); });
$("#fresh").addEventListener("click", () => {
  $("#fresh").style.display = "none";
  clearTimeout(flash.t);
});
loadWeather();
loadGarden();
setInterval(loadWeather, 10 * 60 * 1000);

/* 30秒ごとに新しい記録が届いていないか確認する。
   画面を見ていないときは止め、戻ってきたらすぐ確認する */
setInterval(() => { if (!document.hidden) loadGarden(true); }, 30 * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) loadGarden(true); });
</script>
