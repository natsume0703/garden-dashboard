<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>栽培記録 ｜ 動作確認</title>
<style>
  :root{
    --paper:#F7F9F4;
    --ink:#1B2A20;
    --ink-soft:#5C6B5F;
    --line:#DCE3D6;
    --leaf:#3F6B45;
    --soil:#8A6B4F;
    --water:#2E6F94;
    --warn:#B07A12;
    --alert:#A63D2C;
    --harvest:#7B5EA7;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    padding:0 20px 80px;
    background:var(--paper);
    color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;
    font-size:15px;
    line-height:1.75;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{max-width:880px;margin:0 auto;}

  /* ---------- ヘッダー ---------- */
  header{
    padding:48px 0 28px;
    border-bottom:2px solid var(--ink);
  }
  h1{
    font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    font-size:34px;
    font-weight:600;
    letter-spacing:.14em;
    margin:0 0 6px;
    line-height:1.3;
  }
  .sub{
    font-size:12px;
    color:var(--ink-soft);
    letter-spacing:.08em;
    display:flex;
    align-items:center;
    gap:14px;
    flex-wrap:wrap;
  }
  .reload{
    border:1px solid var(--line);
    background:transparent;
    color:var(--ink-soft);
    font-family:inherit;
    font-size:11px;
    letter-spacing:.08em;
    padding:4px 12px;
    border-radius:2px;
    cursor:pointer;
    transition:background .15s,color .15s;
  }
  .reload:hover{background:var(--ink);color:var(--paper);border-color:var(--ink);}
  .reload:focus-visible{outline:2px solid var(--leaf);outline-offset:2px;}

  /* ---------- 数値帯 ---------- */
  .figures{
    display:flex;
    flex-wrap:wrap;
    gap:0;
    border-bottom:1px solid var(--line);
  }
  .fig{
    flex:1 1 120px;
    padding:22px 0 20px;
    border-right:1px solid var(--line);
  }
  .fig:last-child{border-right:none;}
  .fig b{
    display:block;
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:32px;
    font-weight:600;
    line-height:1;
    letter-spacing:.02em;
  }
  .fig span{
    display:block;
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:.12em;
    margin-top:8px;
  }

  /* ---------- セクション ---------- */
  section{margin-top:52px;}
  h2{
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    font-size:17px;
    font-weight:600;
    letter-spacing:.18em;
    margin:0 0 18px;
    padding-bottom:10px;
    border-bottom:1px solid var(--line);
    display:flex;
    justify-content:space-between;
    align-items:baseline;
  }
  h2 em{
    font-style:normal;
    font-family:"Hiragino Sans",sans-serif;
    font-size:11px;
    letter-spacing:.1em;
    color:var(--ink-soft);
  }

  /* ---------- アラート ---------- */
  .alert{
    display:flex;
    gap:14px;
    align-items:baseline;
    padding:13px 16px;
    border-left:3px solid var(--ink-soft);
    background:#fff;
    margin-bottom:6px;
  }
  .alert.異常{border-left-color:var(--alert);}
  .alert.期限{border-left-color:var(--alert);}
  .alert.収穫{border-left-color:var(--harvest);}
  .alert.水やり{border-left-color:var(--water);}
  .alert.注意{border-left-color:var(--warn);}
  .alert .who{
    font-weight:700;
    white-space:nowrap;
    font-size:14px;
  }
  .alert .tag{
    font-size:10px;
    letter-spacing:.1em;
    padding:2px 7px;
    border-radius:2px;
    white-space:nowrap;
    color:#fff;
    background:var(--ink-soft);
  }
  .alert.異常 .tag,.alert.期限 .tag{background:var(--alert);}
  .alert.収穫 .tag{background:var(--harvest);}
  .alert.水やり .tag{background:var(--water);}
  .alert.注意 .tag{background:var(--warn);}
  .alert .msg{font-size:13.5px;color:var(--ink-soft);}

  /* ---------- 植物カード ---------- */
  .plants{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(258px,1fr));
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
  }
  .card{background:#fff;padding:20px 20px 18px;}
  .card .top{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:10px;
  }
  .card .nm{font-size:16px;font-weight:700;letter-spacing:.04em;}
  .card .phase{font-size:11px;color:var(--ink-soft);letter-spacing:.06em;margin-top:2px;}
  .badge{
    font-size:10.5px;
    letter-spacing:.08em;
    padding:3px 9px;
    border-radius:2px;
    white-space:nowrap;
    border:1px solid;
  }
  .badge.良好{color:var(--leaf);border-color:var(--leaf);}
  .badge.注意{color:var(--warn);border-color:var(--warn);}
  .badge.異常{color:var(--alert);border-color:var(--alert);background:#FBEFED;}
  .badge.unknown{color:var(--ink-soft);border-color:var(--line);}

  /* 乾き具合ゲージ */
  .gauge{margin:18px 0 14px;}
  .gauge .row{
    display:flex;
    justify-content:space-between;
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:.06em;
    margin-bottom:6px;
  }
  .gauge .row .val{color:var(--ink);font-weight:700;}
  .bar{display:flex;gap:2px;height:7px;}
  .bar i{flex:1;background:var(--line);border-radius:1px;}
  .bar i.on{background:var(--water);}
  .bar i.dry{background:var(--soil);}
  .bar.thirsty i.on{background:var(--soil);}

  .note{
    font-size:12.5px;
    color:var(--ink-soft);
    line-height:1.7;
    border-top:1px dotted var(--line);
    padding-top:12px;
    margin-top:2px;
  }
  .note b{color:var(--ink);font-weight:700;}

  /* ---------- 記録テーブル ---------- */
  table{width:100%;border-collapse:collapse;font-size:13px;}
  th{
    text-align:left;
    font-size:10.5px;
    letter-spacing:.12em;
    color:var(--ink-soft);
    font-weight:400;
    padding:0 10px 8px 0;
    border-bottom:1px solid var(--line);
  }
  td{padding:11px 10px 11px 0;border-bottom:1px solid var(--line);vertical-align:top;}
  td.d{color:var(--ink-soft);white-space:nowrap;font-size:12px;}
  td.p{font-weight:700;white-space:nowrap;}
  td.w{color:var(--ink-soft);font-size:12px;}
  .pill{
    display:inline-block;
    font-size:10.5px;
    padding:1px 7px;
    border-radius:2px;
    letter-spacing:.06em;
  }
  .pill.良好{color:var(--leaf);background:#EDF3EC;}
  .pill.注意{color:var(--warn);background:#FBF3E2;}
  .pill.異常{color:var(--alert);background:#FBEFED;}

  /* ---------- 状態表示 ---------- */
  .state{
    padding:60px 0;
    text-align:center;
    color:var(--ink-soft);
    font-size:13px;
    letter-spacing:.08em;
  }
  .state.err{
    text-align:left;
    border-left:3px solid var(--alert);
    background:#fff;
    padding:20px 22px;
    color:var(--ink);
  }
  .state.err b{display:block;margin-bottom:6px;letter-spacing:.06em;}
  .state.err span{font-size:12.5px;color:var(--ink-soft);}

  .fade{animation:fade .45s ease both;}
  @keyframes fade{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  @media (prefers-reduced-motion:reduce){.fade{animation:none;}}

  @media(max-width:560px){
    h1{font-size:26px;}
    .fig b{font-size:26px;}
    body{padding:0 16px 60px;}
    td.w{display:none;}
    th.w{display:none;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>栽培記録</h1>
    <div class="sub">
      <span id="stamp">読み込み中</span>
      <button class="reload" id="reload" type="button">最新に更新</button>
    </div>
  </header>

  <div id="app"><div class="state">Notionのデータを取得しています…</div></div>

</div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* 最終水やりからの経過日数を、土の乾きとして7段階で表す */
function gauge(days){
  if (days === null || days === undefined) {
    return `<div class="gauge">
      <div class="row"><span>乾き具合</span><span>記録なし</span></div>
      <div class="bar">${'<i></i>'.repeat(7)}</div></div>`;
  }
  const filled = Math.max(0, 7 - Math.min(days, 7));
  const thirsty = days >= 4;
  let cells = "";
  for (let i = 0; i < 7; i++) cells += `<i class="${i < filled ? "on" : ""}"></i>`;
  const label = days === 0 ? "今日" : `${days}日前`;
  return `<div class="gauge">
    <div class="row"><span>最終水やり</span><span class="val">${label}</span></div>
    <div class="bar${thirsty ? " thirsty" : ""}">${cells}</div></div>`;
}

function render(d){
  const s = d.stats || {};
  $("#stamp").textContent = "最終同期 " + (d.generated_at || "").replace("T", " ").slice(0, 16);

  let h = "";

  /* 数値帯 */
  h += `<div class="figures">
    <div class="fig"><b>${s.plants_tracked ?? 0}</b><span>育てている株</span></div>
    <div class="fig"><b>${s.records_7d ?? 0}</b><span>今週の記録</span></div>
    <div class="fig"><b>${s.alerts_count ?? 0}</b><span>気になる点</span></div>
    <div class="fig"><b>${s.total_records ?? 0}</b><span>記録の総数</span></div>
  </div>`;

  /* 気になっていること */
  const al = d.alerts || [];
  h += `<section><h2>気になっていること<em>優先度順</em></h2>`;
  if (!al.length){
    h += `<div class="state">いま対応が必要な株はありません。</div>`;
  } else {
    al.forEach(a => {
      h += `<div class="alert ${esc(a.level)}">
        <span class="who">${esc(a.plant)}</span>
        <span class="tag">${esc(a.level)}</span>
        <span class="msg">${esc(a.message)}</span>
      </div>`;
    });
  }
  h += `</section>`;

  /* 株ごとの様子 */
  const pl = d.plants || [];
  h += `<section><h2>株ごとの様子<em>最新の記録より</em></h2><div class="plants">`;
  pl.forEach(p => {
    const hl = p.health || "";
    const cls = ["良好","注意","異常"].includes(hl) ? hl : "unknown";
    h += `<div class="card">
      <div class="top">
        <div>
          <div class="nm">${esc(p.name)}</div>
          <div class="phase">${esc(p.phase || "フェーズ未設定")}</div>
        </div>
        <span class="badge ${cls}">${esc(hl || "未判定")}</span>
      </div>
      ${gauge(p.days_since_water)}
      <div class="note">
        ${p.action ? `<b>次の一手</b>　${esc(p.action)}` : (p.ai_comment ? esc(p.ai_comment) : "コメントはまだありません。")}
      </div>
    </div>`;
  });
  h += `</div></section>`;

  /* 直近の記録 */
  const rc = (d.records || []).slice(0, 20);
  h += `<section><h2>直近の記録<em>新しい順に20件</em></h2>
    <table><thead><tr>
      <th>日付</th><th>株</th><th>状態</th><th>水やり</th><th class="w">作業</th>
    </tr></thead><tbody>`;
  rc.forEach(r => {
    const hl = r.health || "";
    const cls = ["良好","注意","異常"].includes(hl) ? hl : "";
    const works = (r.works && r.works.length) ? r.works.join("・") : "—";
    h += `<tr>
      <td class="d">${esc((r.date || "").replace(/-/g, "."))}</td>
      <td class="p">${esc(r.plant || "—")}</td>
      <td>${hl ? `<span class="pill ${cls}">${esc(hl)}</span>` : "—"}</td>
      <td class="d">${esc(r.watering || "—")}</td>
      <td class="w">${esc(works)}</td>
    </tr>`;
  });
  h += `</tbody></table></section>`;

  const app = $("#app");
  app.className = "fade";
  app.innerHTML = h;
}

async function load(){
  $("#app").innerHTML = `<div class="state">Notionのデータを取得しています…</div>`;
  try {
    const res = await fetch("data.json?t=" + Date.now(), {cache:"no-store"});
    if (!res.ok) throw new Error("HTTP " + res.status);
    render(await res.json());
  } catch (e) {
    $("#stamp").textContent = "同期できていません";
    $("#app").innerHTML = `<div class="state err">
      <b>データを読み込めませんでした</b>
      <span>data.json が同じ場所にあるか確認してください。GitHub Actions の同期が一度も成功していない場合は、Actions タブから「Sync Notion to data.json」を実行します。（${esc(e.message)}）</span>
    </div>`;
  }
}

$("#reload").addEventListener("click", load);
load();
</script>
</body>
</html>
